<body>
    <div id="map"></div>
    <script>
        // 地図の初期化
        var map = L.map('map').setView([32.74423233835673, 129.87816907636466], 17);
        map.attributionControl.setPrefix(''); // クレジットを非表示

        // OpenStreetMapのタイルレイヤーを追加
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.control.attribution({position: 'topright'}).addTo(map); // クレジットを左下に表示

        // マーカーを追加
        L.marker([32.74423233835673, 129.87816907636466]).addTo(map)
            .bindPopup('ピン')
            .openPopup();
    </script>
