<script>
    document.addEventListener('DOMContentLoaded', function () {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            var tooltip = new bootstrap.Tooltip(tooltipTriggerEl);
            tooltip.show();
            return tooltip;
        });


        if (!localStorage.getItem('toastDisplayed')) {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'))
            var toastList = toastElList.map(function (toastEl) {
                return new bootstrap.Toast(toastEl, { autohide: false })
            })
            toastList.forEach(toast => toast.show())
            // もしもトースト内の✕ボタンを押したら、ローカルストレージにtrueを保存する
            toastElList.forEach(function (toastEl) {
                toastEl.addEventListener('hidden.bs.toast', function () {
                    localStorage.setItem('toastDisplayed', 'true')
                })
            })
        }
        // クエリ文字列を取得し、ローカルストレージに保存する
        getQueryParams();
        // ローカルストレージの内容をコンソールに表示する
        displayLocalStorageData();
        // ローカルストレージに保存されているスタンプの情報を取得し、もしもスタンプが押されていたら、スタンプを押したことを示す画像に変更する
        checkStamp();
    });

    //クエリ文字列を取得し、ローカルストレージに保存するコード。Item名はquestionID、値はtrueかfalse。デフォルトではflaseなので、trueにするためにはクエリ文字列を取得する必要がある。
    function getQueryParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value;
            localStorage.setItem(key, value);
            // もし、クエリ文字列のkeyがclear、valueがtrueの場合、ローカルストレージをクリアする
            if (key === 'clear' && value === 'true') {
                localStorage.clear();
            }
        }
    }
    
    function displayLocalStorageData() {
        //現在日時
        console.log(new Date().toLocaleString());
        console.log('ローカルストレージの内容:');
        console.log('------------------------');

        if (localStorage.length === 0) {
            console.log('ローカルストレージは空です。');
            return;
        }

        for (let i = 0; i < localStorage.length; i++) {
            // キーを取得、ただし取得文字に特殊文字が含まれる場合はエスケープする
            const key = encodeURIComponent(localStorage.key(i));
            let value = encodeURIComponent(localStorage.getItem(key));

            // JSON形式のデータの場合、パースを試みる
            try {
            value = JSON.parse(value);
            } catch (e) {
            // パースに失敗した場合は、元の文字列のまま
            }

            console.log(`キー: ${key}`);
            console.log(`値:`, value);
            console.log('------------------------');
        }
        }


    // ローカルストレージに保存されているスタンプの情報を取得し、もしもスタンプが押されていたら、スタンプを押したことを示す画像に変更する
    function checkStamp() {
        let stampCount = 0;
        for (let i = 0; i < localStorage.length; i++) {
            const key = encodeURIComponent(localStorage.key(i));
            let value = encodeURIComponent(localStorage.getItem(key));
            if (value === 'true' && key !== 'toastDisplayed') {
                // idがkeyの要素に含まれるimgの中の画像をスタンプを押したことを示す画像に変更する
                const element = document.getElementById(key);
                if (element) {
                    element.getElementsByTagName('img')[0].src = 'img/stamp_com1.png';
                }
                // スタンプの数を1増やす
                stampCount++;
            }
        }
        // スタンプの数を更新する
        document.getElementById('stampCount').textContent = stampCount;
    }

    function encryptText(text, password) {
        var originalText = text;
        var password = password;

        // AES暗号化アルゴリズムを使用してテキストを暗号化
        var encrypted = CryptoJS.AES.encrypt(originalText, password);

       return encrypted.toString();
    }


</script>
